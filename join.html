<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejoindre un foyer sur KOKON</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #EDE3D6;
      color: #1E1E1E;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { width: min(100%, 420px); text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.3; margin: 16px 0; }
    .code {
      margin: 8px 0 0;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #BD612E;
    }
    a.open {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      margin-top: 24px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #9E4A22;
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
    }
    .store { margin-top: 16px; }
    .store a { color: #5E5750; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <path fill="#BD612E" d="M32 6 6 30h8v26h14V40h8v16h14V30h8z"/>
    </svg>
    <h1 id="message"></h1>
    <p id="code" class="code" hidden></p>
    <a id="open" class="open" hidden>Ouvrir KOKON</a>
    <p id="store" class="store" hidden><a id="download">Télécharger KOKON</a></p>
  </main>
  <script>
    var APP_STORE_URL = "";
    var params = new URLSearchParams(window.location.search);
    var raw = params.get("code") || "";
    var code = raw.trim().toUpperCase();
    var message = document.getElementById("message");
    var codeNode = document.getElementById("code");
    var open = document.getElementById("open");
    var store = document.getElementById("store");
    var download = document.getElementById("download");
    if (/^[A-Z0-9]{6,10}$/.test(code)) {
      message.textContent = "Tu es invité à rejoindre un foyer sur KOKON";
      codeNode.textContent = code;
      codeNode.hidden = false;
      open.href = "kokon://join/" + code;
      open.hidden = false;
      if (APP_STORE_URL.length > 0) {
        download.href = APP_STORE_URL;
        store.hidden = false;
      }
      window.location.href = "kokon://join/" + code;
    } else {
      message.textContent = "Ce lien d'invitation n'est pas valable.";
    }
  </script>
</body>
</html>
