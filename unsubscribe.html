<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Désinscription — KOKON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #EDE3D6;
      color: #1E1E1E;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { width: min(100%, 420px); text-align: center; }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.18em;
      font-size: 0.9rem;
      color: #9E4A22;
      margin-top: 8px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.3; margin: 16px 0; }
    p { line-height: 1.5; margin: 12px 0; }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      background: #9E4A22;
      color: #FFFFFF;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.6; cursor: default; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.png" alt="" width="72" height="72">
    <div class="brand">KOKON</div>
    <h1 id="title">Ne plus recevoir les e-mails de KOKON ?</h1>
    <p id="message" hidden></p>
    <button id="confirm" type="button">Me désinscrire</button>
  </main>
  <script>
    var ENDPOINT = "https://bgpxbhiassyxyhccbxfg.supabase.co/functions/v1/unsubscribe";
    var token = new URLSearchParams(window.location.search).get("t") || "";
    var title = document.getElementById("title");
    var message = document.getElementById("message");
    var button = document.getElementById("confirm");

    function show(text) {
      title.hidden = true;
      message.textContent = text;
      message.hidden = false;
      button.hidden = true;
    }

    var invalid = "Ce lien n’est plus valable. Change ce réglage dans KOKON, Profil, Notifications.";
    if (token.length === 0) {
      show(invalid);
    }

    button.addEventListener("click", function () {
      button.disabled = true;
      fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: token })
      }).then(function (response) {
        if (response.ok) {
          show("C’est fait. Tu ne recevras plus nos e-mails. Les e-mails de compte (codes, sécurité) continuent.");
        } else {
          show(invalid);
        }
      }).catch(function () {
        show(invalid);
      });
    });
  </script>
</body>
</html>
